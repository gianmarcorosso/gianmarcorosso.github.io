# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to publish (root of the project)
  publish = "."

  # No build command needed (static site)
  command = ""

# SPA fallback - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "SAMEORIGIN"

    # Prevent MIME type sniffing
    X-Content-Type-Options = "nosniff"

    # XSS Protection
    X-XSS-Protection = "1; mode=block"

    # Referrer Policy
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Content Security Policy
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self' 'unsafe-inline' https://open.spotify.com https://widget.bandsintown.com https://widgetv3.bandsintown.com https://www.youtube.com; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data: https: blob:; \
      font-src 'self' data:; \
      frame-src https://open.spotify.com https://bandsintown.com https://widget.bandsintown.com https://www.youtube.com; \
      connect-src 'self' https://api.spotify.com https://rest.bandsintown.com; \
      media-src 'self' https://open.spotify.com;
    """

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
